<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Treasury Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #002147;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 100%;
            max-width: 380px;
            border-top: 5px solid #f1c40f;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card shadow-lg p-4 bg-white">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">🏛️ ICT PORTAL</h4>
            <div class="text-muted small">The National Treasury</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} p-2 small mb-3">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Username</label>
                <input type="text" name="username" class="form-control" value="{{ user or 'admin' }}" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Password (8-32 chars)</label>
                <input type="password" name="password" minlength="8" maxlength="32" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Sign In</button>
        </form>
    </div>
</body>
</html>
